[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
# S104: binding 0.0.0.0 is correct inside a container
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
